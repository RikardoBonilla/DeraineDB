name: DeraineDB Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Set up Zig
      uses: mlugg/setup-zig@v1
      with:
        version: 0.15.2

    - name: Full Build (release-fast)
      run: make all

    - name: Zig Internal Tests
      run: |
        cd core
        zig test src/root.zig
        zig test src/test_storage.zig

    - name: Go Orchestrator Tests
      run: go test -v ./...

    - name: Vulnerability Scan
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
